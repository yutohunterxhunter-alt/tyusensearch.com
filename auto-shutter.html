<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>オートシャッター - スライド自動撮影</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0d0d0d;
    color: #f0f0f0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 12px 16px;
    background: #1a1a1a;
    border-bottom: 1px solid #333;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  header h1 {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }

  #status-badge {
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 12px;
    font-weight: 600;
    background: #333;
    color: #888;
    transition: all 0.3s;
  }
  #status-badge.watching {
    background: #1a3a1a;
    color: #4caf50;
  }
  #status-badge.triggered {
    background: #3a1a1a;
    color: #ff5252;
  }

  .camera-wrap {
    position: relative;
    flex-shrink: 0;
    background: #000;
    aspect-ratio: 4/3;
    overflow: hidden;
  }

  #video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  #flash-overlay {
    position: absolute;
    inset: 0;
    background: #fff;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.05s;
  }

  #diff-meter {
    position: absolute;
    bottom: 8px;
    left: 8px;
    right: 8px;
    height: 4px;
    background: rgba(255,255,255,0.15);
    border-radius: 2px;
    overflow: hidden;
  }
  #diff-bar {
    height: 100%;
    width: 0%;
    background: #4caf50;
    border-radius: 2px;
    transition: width 0.2s, background 0.2s;
  }

  #capture-count {
    position: absolute;
    top: 8px;
    right: 10px;
    font-size: 13px;
    font-weight: 700;
    color: #fff;
    text-shadow: 0 1px 4px rgba(0,0,0,0.8);
  }

  .controls {
    padding: 14px 16px;
    background: #1a1a1a;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .control-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .control-row label {
    font-size: 13px;
    color: #aaa;
    white-space: nowrap;
    min-width: 80px;
  }

  input[type=range] {
    flex: 1;
    accent-color: #4caf50;
    height: 4px;
  }

  .val-display {
    font-size: 13px;
    color: #ccc;
    min-width: 40px;
    text-align: right;
  }

  .btn-row {
    display: flex;
    gap: 10px;
    margin-top: 2px;
  }

  button {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
    -webkit-tap-highlight-color: transparent;
  }

  #btn-start {
    background: #4caf50;
    color: #fff;
  }
  #btn-start:active { background: #388e3c; transform: scale(0.97); }

  #btn-stop {
    background: #333;
    color: #aaa;
  }
  #btn-stop:not(:disabled):active { background: #444; transform: scale(0.97); }
  #btn-stop:disabled { opacity: 0.4; cursor: default; }

  #btn-clear {
    flex: 0 0 auto;
    padding: 12px 16px;
    background: #2a2a2a;
    color: #888;
    font-size: 13px;
  }
  #btn-clear:active { background: #333; }

  .section-title {
    font-size: 12px;
    color: #666;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    padding: 10px 16px 4px;
  }

  #gallery {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 2px;
    padding: 0 2px 2px;
  }

  .thumb-wrap {
    position: relative;
    aspect-ratio: 4/3;
    background: #111;
    overflow: hidden;
  }

  .thumb-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .thumb-wrap .thumb-num {
    position: absolute;
    bottom: 4px;
    left: 5px;
    font-size: 10px;
    color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,0.9);
    font-weight: 700;
  }

  .thumb-wrap .dl-btn {
    position: absolute;
    top: 4px;
    right: 4px;
    background: rgba(0,0,0,0.6);
    border: none;
    border-radius: 6px;
    color: #fff;
    font-size: 14px;
    padding: 3px 6px;
    cursor: pointer;
    flex: none;
    line-height: 1;
  }
  .thumb-wrap .dl-btn:active { background: rgba(0,0,0,0.9); }

  #empty-msg {
    text-align: center;
    color: #444;
    font-size: 13px;
    padding: 24px 16px;
    grid-column: 1/-1;
  }

  canvas { display: none; }

  .cooldown-indicator {
    position: absolute;
    top: 8px;
    left: 10px;
    font-size: 11px;
    color: rgba(255,255,255,0.6);
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
  }
</style>
</head>
<body>

<header>
  <h1>📷 オートシャッター</h1>
  <span id="status-badge">待機中</span>
</header>

<div class="camera-wrap">
  <video id="video" autoplay muted playsinline></video>
  <div id="flash-overlay"></div>
  <div id="diff-meter"><div id="diff-bar"></div></div>
  <span id="capture-count"></span>
  <span class="cooldown-indicator" id="cooldown-label"></span>
</div>

<canvas id="canvas-current"></canvas>
<canvas id="canvas-prev"></canvas>

<div class="controls">
  <div class="control-row">
    <label>感度</label>
    <input type="range" id="sensitivity" min="1" max="30" value="8" step="1">
    <span class="val-display" id="sens-val">8%</span>
  </div>
  <div class="control-row">
    <label>クールダウン</label>
    <input type="range" id="cooldown" min="1" max="10" value="3" step="0.5">
    <span class="val-display" id="cool-val">3秒</span>
  </div>
  <div class="btn-row">
    <button id="btn-start">▶ 開始</button>
    <button id="btn-stop" disabled>■ 停止</button>
    <button id="btn-clear">クリア</button>
  </div>
</div>

<div class="section-title">撮影済み (<span id="count-label">0</span>枚)</div>
<div id="gallery"><p id="empty-msg">まだ撮影されていません</p></div>

<script>
const video = document.getElementById('video');
const canvasCur = document.getElementById('canvas-current');
const canvasPrev = document.getElementById('canvas-prev');
const ctxCur = canvasCur.getContext('2d', { willReadFrequently: true });
const ctxPrev = canvasPrev.getContext('2d', { willReadFrequently: true });
const flash = document.getElementById('flash-overlay');
const diffBar = document.getElementById('diff-bar');
const statusBadge = document.getElementById('status-badge');
const captureCountEl = document.getElementById('capture-count');
const cooldownLabel = document.getElementById('cooldown-label');
const gallery = document.getElementById('gallery');
const emptyMsg = document.getElementById('empty-msg');
const countLabel = document.getElementById('count-label');

const sensInput = document.getElementById('sensitivity');
const coolInput = document.getElementById('cooldown');
const sensVal = document.getElementById('sens-val');
const coolVal = document.getElementById('cool-val');
const btnStart = document.getElementById('btn-start');
const btnStop = document.getElementById('btn-stop');
const btnClear = document.getElementById('btn-clear');

const SAMPLE_W = 160;
const SAMPLE_H = 120;
const CHECK_INTERVAL = 300; // ms

canvasCur.width = SAMPLE_W; canvasCur.height = SAMPLE_H;
canvasPrev.width = SAMPLE_W; canvasPrev.height = SAMPLE_H;

let stream = null;
let checkTimer = null;
let prevData = null;
let watching = false;
let cooldownUntil = 0;
let captureCount = 0;
let capturedPhotos = [];
let cooldownTimer = null;

sensInput.addEventListener('input', () => sensVal.textContent = sensInput.value + '%');
coolInput.addEventListener('input', () => coolVal.textContent = coolInput.value + '秒');

btnStart.addEventListener('click', startWatching);
btnStop.addEventListener('click', stopWatching);
btnClear.addEventListener('click', clearGallery);

async function startWatching() {
  if (!stream) {
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: { ideal: 'environment' },
          width: { ideal: 1280 },
          height: { ideal: 960 }
        },
        audio: false
      });
      video.srcObject = stream;
      await video.play();
    } catch (e) {
      alert('カメラにアクセスできません: ' + e.message);
      return;
    }
  }

  prevData = null;
  watching = true;
  setStatus('watching', '監視中');
  btnStart.disabled = true;
  btnStop.disabled = false;
  checkTimer = setInterval(checkFrame, CHECK_INTERVAL);
}

function stopWatching() {
  watching = false;
  clearInterval(checkTimer);
  checkTimer = null;
  setStatus('idle', '待機中');
  btnStart.disabled = false;
  btnStop.disabled = true;
  diffBar.style.width = '0%';
  cooldownLabel.textContent = '';
}

function setStatus(state, text) {
  statusBadge.textContent = text;
  statusBadge.className = '';
  if (state === 'watching') statusBadge.classList.add('watching');
  if (state === 'triggered') statusBadge.classList.add('triggered');
}

function checkFrame() {
  if (!watching || video.readyState < 2) return;

  ctxCur.drawImage(video, 0, 0, SAMPLE_W, SAMPLE_H);
  const curData = ctxCur.getImageData(0, 0, SAMPLE_W, SAMPLE_H).data;

  if (!prevData) {
    prevData = curData.slice();
    return;
  }

  const diff = pixelDiff(prevData, curData);
  const diffPct = diff * 100;

  diffBar.style.width = Math.min(diffPct * 4, 100) + '%';
  diffBar.style.background = diffPct > parseFloat(sensInput.value) ? '#ff5252' : '#4caf50';

  const now = Date.now();
  if (now < cooldownUntil) {
    const remaining = ((cooldownUntil - now) / 1000).toFixed(1);
    cooldownLabel.textContent = `⏳ ${remaining}s`;
    prevData = curData.slice();
    return;
  }
  cooldownLabel.textContent = '';

  if (diffPct > parseFloat(sensInput.value)) {
    triggerCapture();
    const coolSec = parseFloat(coolInput.value);
    cooldownUntil = now + coolSec * 1000;
  }

  prevData = curData.slice();
}

function pixelDiff(a, b) {
  let total = 0;
  const len = a.length;
  for (let i = 0; i < len; i += 4) {
    const dr = a[i]   - b[i];
    const dg = a[i+1] - b[i+1];
    const db = a[i+2] - b[i+2];
    total += (Math.abs(dr) + Math.abs(dg) + Math.abs(db)) / 3;
  }
  return total / (len / 4) / 255;
}

function triggerCapture() {
  setStatus('triggered', '撮影！');
  setTimeout(() => setStatus('watching', '監視中'), 600);

  // Flash effect
  flash.style.opacity = '0.8';
  setTimeout(() => flash.style.opacity = '0', 150);

  // Full-res capture
  const cap = document.createElement('canvas');
  cap.width = video.videoWidth || 640;
  cap.height = video.videoHeight || 480;
  const capCtx = cap.getContext('2d');
  capCtx.drawImage(video, 0, 0, cap.width, cap.height);
  const dataUrl = cap.toDataURL('image/jpeg', 0.92);

  captureCount++;
  capturedPhotos.push(dataUrl);
  captureCountEl.textContent = captureCount + '枚';
  addThumb(dataUrl, captureCount);

  // Shutter sound via AudioContext
  playShutterSound();
}

function playShutterSound() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const buf = ctx.createBuffer(1, ctx.sampleRate * 0.08, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ctx.sampleRate * 0.02));
    }
    const src = ctx.createBufferSource();
    src.buffer = buf;
    const gain = ctx.createGain();
    gain.gain.value = 0.3;
    src.connect(gain);
    gain.connect(ctx.destination);
    src.start();
  } catch (_) {}
}

function addThumb(dataUrl, num) {
  if (emptyMsg) emptyMsg.remove();
  countLabel.textContent = captureCount;

  const wrap = document.createElement('div');
  wrap.className = 'thumb-wrap';

  const img = document.createElement('img');
  img.src = dataUrl;

  const numEl = document.createElement('span');
  numEl.className = 'thumb-num';
  numEl.textContent = '#' + num;

  const dlBtn = document.createElement('button');
  dlBtn.className = 'dl-btn';
  dlBtn.textContent = '↓';
  dlBtn.title = '保存';
  dlBtn.addEventListener('click', () => downloadPhoto(dataUrl, num));

  wrap.appendChild(img);
  wrap.appendChild(numEl);
  wrap.appendChild(dlBtn);
  gallery.appendChild(wrap);
  wrap.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function downloadPhoto(dataUrl, num) {
  const a = document.createElement('a');
  a.href = dataUrl;
  a.download = `slide_${String(num).padStart(3, '0')}.jpg`;
  a.click();
}

function clearGallery() {
  captureCount = 0;
  capturedPhotos = [];
  captureCountEl.textContent = '';
  countLabel.textContent = '0';
  gallery.innerHTML = '<p id="empty-msg">まだ撮影されていません</p>';
}

// Keep screen awake if supported
if ('wakeLock' in navigator) {
  navigator.wakeLock.request('screen').catch(() => {});
}
</script>
</body>
</html>
